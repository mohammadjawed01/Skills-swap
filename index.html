<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill-Swap</title>
    <link rel="stylesheet" href="skill-swap-css/style.css">
    <!-- <link rel="stylesheet" href="skill-swap-css/edit-profile.css"> -->
</head>

<body>
    <header class="header-section">

        <a class="logo" href="#home">
            <b>&#8644;</b>
            Skill
            <span>Swap</span>
        </a>

        <nav class="links">
            <a href="#home">Home</a>
            <a href="#explore">Explore</a>
            <a href="#matches">Matches</a>
            <a href="#dashboard">Dashboard</a>
        </nav>

        <div class="action">
            <button id="theme">🌙</button>
            <button id="profile">MJ</button>
        </div>
    </header>

    <!-- profile section -->


    <!-- body sextion -->
    <main>
        <section class="hero" id="home">
            <div class="hero-copy reveal show">
                <div class="pill">✦ PEER-TO-PEER LEARNING</div>
                <h1>
                    Share what you know.
                    <br>
                    <em>Learn what you need.</em>
                </h1>
                <p>Find student whose skills complement your and turn knowledge into meaningful exchanges.</p>
                <div class="hero-action">
                    <a class="primary btn" href="#matches">
                        Find my Match
                        <span>→</span>
                    </a>
                    <a class="ghost btn" href="#skills">
                        Explore Skils
                    </a>
                </div>
                <div class="proof">
                    <div>
                        <b>250+</b>
                        <small>skills</small>
                    </div>
                    <div>
                        <b>120+</b>
                        <small>Learners</small>
                    </div>
                    <div>
                        <b>86%</b>
                        <small>Avg. Match</small>
                    </div>

                </div>
            </div>
        </section>
    </main>


    <script src="script.js"></script>
</body>

</html>
